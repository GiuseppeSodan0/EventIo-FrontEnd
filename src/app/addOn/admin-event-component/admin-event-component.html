<div class="event-admin">
  <div class="event-header">
    <h2>Gestione Eventi</h2>

    <div class="event-header-actions">
      <button class="admin-btn btn-create" (click)="openCreate()">
        ➕ CREA EVENTO
      </button>

      <button class="btn-back-close" type="button" aria-label="Torna indietro" (click)="goBack()">
        ×
      </button>
    </div>
  </div>

  <div class="events-grid">

    <div class="event-card" *ngFor="let e of events()">
      <div class="event-image-admin-wrapper">
        <div class="event-image-admin" [style.background-image]="'url(' + e.imagePath + ')'" [title]="e.name"></div>
      </div>
      <div class="event-info-admin">
        <div class="event-title-admin">{{ e.name }}</div>
        <div class="event-meta-admin">
          <span class="event-location-admin">{{ e.location }}</span>
          <span class="event-type-admin">{{ e.type }}</span>
        </div>
        <div class="event-date-admin">{{ e.date | date: 'dd/MM/yyyy' }}</div>
        <div class="event-actions">
          <button class="admin-btn btn-delete" [class.is-loading]="isDeleting(e)" [disabled]="isDeleting(e)" (click)="delete(e)">
            {{ isDeleting(e) ? 'ELIMINO...' : '🗑 ELIMINA' }}
          </button>
        </div>
      </div>
    </div>
  </div>

  
  <div class="overlay" *ngIf="modalOpen" (click)="close()">

    <div class="modal" (click)="$event.stopPropagation()">
      <button class="close" (click)="close()">X</button>

      <h3 class="modal-title">{{ editMode ? 'MODIFICA EVENTO' : 'CREA EVENTO' }}</h3>

      <div class="form-grid">
        <label>
          Nome evento
          <input [(ngModel)]="form.name" placeholder="Nome" required>
        </label>

        <label>
          Luogo
          <input [(ngModel)]="form.location" placeholder="Location" required>
        </label>

        <label>
          Data evento
          <input [(ngModel)]="formDate" type="date" required>
        </label>

        <label>
          Categoria
          <select [(ngModel)]="form.type">
            <option *ngFor="let t of types" [value]="t">{{ t }}</option>
          </select>
        </label>

        <label>
          Prezzo ticket
          <input [(ngModel)]="form.ticketPrice" class="no-spinner" type="number" min="0" step="0.01" placeholder="Prezzo" required>
        </label>

        <label>
          Max ticket
          <input [(ngModel)]="form.maxTickets" class="no-spinner" type="number" min="1" placeholder="Max ticket" required>
        </label>

        <label class="field-full">
          Immagine evento
          <input type="file" accept="image/*" (change)="onImageSelected($event)">
          <small class="field-help" *ngIf="selectedImageFile">
            File selezionato: {{ selectedImageFile.name }}
          </small>
          <small class="field-help" *ngIf="!selectedImageFile && form.imagePath">
            Immagine corrente presente.
          </small>
        </label>

        <label class="field-full">
          Descrizione
          <textarea [(ngModel)]="form.description" rows="4" placeholder="Descrizione evento" required></textarea>
        </label>
      </div>

      <div class="form-actions">
        <p class="upload-status" *ngIf="uploadInProgress">Upload immagine in corso...</p>
        <p class="upload-status error" *ngIf="saveError">{{ saveError }}</p>
        <button class="admin-btn btn-edit" type="button" (click)="close()">ANNULLA</button>
        <button class="admin-btn btn-save" type="button" (click)="save()" [disabled]="uploadInProgress">
          {{ editMode ? 'AGGIORNA' : 'SALVA' }}
        </button>
      </div>

    </div>
  </div>
</div>
