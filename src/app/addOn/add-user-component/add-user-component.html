<div>
  <div>Inserisci un nuovo utente</div>

  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <input placeholder="name" type="text" formControlName="name"/>
    <input placeholder="surname" type="text" formControlName="surname"/>
    <input placeholder="email" type="text" formControlName="email"/>
    <input placeholder="dateOfBirth" type="date" formControlName="dateOfBirth"/>
    <input placeholder="password" type="text" formControlName="password"/>
    
    <button type="submit">Salva</button>
  </form>

</div>
