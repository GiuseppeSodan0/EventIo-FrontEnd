<div class="user-header">
  <h2 class="user-title">GESTIONE UTENTI</h2>
</div>


<div class="filters">
  <input
    type="text"
    placeholder="Cerca utente..."
    [(ngModel)]="search"
    (input)="filterUsers()"
  />

  <select [(ngModel)]="roleFilter" (change)="filterUsers()">
    <option value="ALL">Tutti</option>
    <option value="ADMIN">Admin</option>
    <option value="USER">User</option>
  </select>
</div>


<div class="users-grid">
  <div class="user-card" *ngFor="let user of filteredUsers">

    <h3>{{ user.name }} {{ user.surname }}</h3>
    <p>{{ user.email }}</p>

    <span class="role-badge" [ngClass]="user.role">
      {{ user.role }}
    </span>

    <div class="actions">
      <button class="delete"(click)="deleteUser(user.id ?? undefined)">
        Elimina
      </button>
    </div>

  </div>
</div>
