<div class="page">
    <div class="content-wrap">
        <header class="hero">
            <span class="hero-eyebrow">Account</span>
            <h1 class="hero-title">Nuova Password</h1>
        </header>
        <section class="form-shell">
            <article class="form-card">

                <!-- Stato: Password aggiornata -->
                <div *ngIf="done" style="text-align:center; padding: 20px; color: var(--text-on-inverse-primary);">
                    <h2 style="margin-bottom: 10px;">Password aggiornata!</h2>
                    <p style="color: var(--text-on-inverse-muted); margin-bottom: 25px;">
                        Puoi ora accedere con la nuova password.
                    </p>
                    <button class="save-btn login-btn" (click)="goToLogin()">Vai al Login</button>
                </div>

                <!-- Stato: Form (Aggiunte le classi user-form e login-form) -->
                <form class="user-form login-form" *ngIf="!done" [formGroup]="form" (ngSubmit)="onSubmit()">
                    <div class="field field-full">
                        <label>Nuova Password</label>
                        <input type="password" formControlName="newPassword" placeholder="Minimo 6 caratteri" />
                    </div>
                    
                    <div class="field field-full">
                        <label>Conferma Password</label>
                        <input type="password" formControlName="confirmPassword" placeholder="Ripeti la password" />
                    </div>
                    
                    <!-- Messaggio di errore adattato -->
                    <p class="error" *ngIf="error" style="color: #ff5252; font-size: 0.85rem; margin: 0;">
                        {{ error }}
                    </p>
                    
                    <div class="form-actions field-full">
                        <button class="save-btn login-btn" type="submit">Reimposta Password</button>
                    </div>
                </form>

            </article>
        </section>
    </div>
</div>
