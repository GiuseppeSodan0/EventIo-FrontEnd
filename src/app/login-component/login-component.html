<div class="page">
  <div class="content-wrap">
    <header class="hero">
      <span class="hero-eyebrow">Welcome back</span>
      <h1 class="hero-title">Accedi</h1>
      <p class="hero-subtitle">
        Inserisci le tue credenziali per continuare.
      </p>
    </header>

    <section class="form-shell">
      <article class="form-card">
        <div class="card-rank">+</div>

        <div class="card-top">
          <span class="chip">Login</span>
        </div>

        <form class="user-form login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="field field-full">
            <label for="email">Email</label>
            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="Inserisci l'email"
            />
          </div>

          <div class="field field-full">
            <label for="password">Password</label>
            <input
              id="password"
              type="password"
              formControlName="password"
              placeholder="Inserisci la password"
            />
          </div>

          <div class="card-divider field-full"></div>

          <div class="form-actions field-full">
            <button class="save-btn login-btn" type="submit">Accedi</button>
          </div>
        </form>
      </article>
    </section>
  </div>
</div>
