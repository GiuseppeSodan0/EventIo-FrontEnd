<div class="page">
  <div class="content-wrap">
    <header class="hero">
      <span class="hero-eyebrow">Benvenuto</span>
      <h1 class="hero-title">Accedi</h1>
    </header>

    <section class="form-shell">
      <article class="form-card">
        <div class="card-rank">+</div>

        <div class="nav-brand" aria-label="EventIO brand" style="text-align: center">
            <img class="brand-logo" src="/media/logo-eventio.png" alt="EventIO" width="100" />
        </div>

        <form class="user-form login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="field field-full">
            <label for="email">Email</label>
            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="Inserisci l'email"
            />
          </div>

          <div class="field field-full">
            <label for="password">Password</label>
            <input
              id="password"
              type="password"
              formControlName="password"
              placeholder="Inserisci la password"
            />
          </div>

          <div class="card-divider field-full"></div>

          <div class="form-actions field-full">
            <p>Non hai un account? Registrati</p>
            <button class="save-btn login-btn" type="submit">Accedi</button>
          </div>
        </form>
      </article>
    </section>
  </div>
</div>
