<div class="page">
    <div class="content-wrap">
        <header class="hero">
            <span class="hero-eyebrow">Account</span>
            <h1 class="hero-title">Password dimenticata</h1>
            <!-- Opzionale: puoi aggiungere un hero-subtitle se vuoi un testo descrittivo -->
            <!-- <p class="hero-subtitle">Inserisci la tua email per recuperare l'accesso.</p> -->
        </header>
        <section class="form-shell">
            <article class="form-card">

                <!-- Stato: Email inviata -->
                <div *ngIf="sent" style="text-align:center; padding: 20px; color: var(--text-on-inverse-primary);">
                    <h2>Email inviata!</h2>
                    <p style="color: var(--text-on-inverse-muted); margin-top: 10px;">
                        Controlla la tua casella e clicca sul link per resettare la password.
                    </p>
                </div>

                <!-- Stato: Form (Aggiunte le classi user-form e login-form) -->
                <form class="user-form login-form" *ngIf="!sent" [formGroup]="form" (ngSubmit)="onSubmit()">
                    <div class="field field-full">
                        <label>Inserisci la tua Email per recuperare la tua password</label>
                        <input type="email" formControlName="email" placeholder="Email" />
                    </div>
                    
                    <p class="error" *ngIf="error" style="color: #ff5252; font-size: 0.85rem; margin: 0;">
                        {{ error }}
                    </p>
                    
                    <div class="form-actions field-full">
                        <button class="save-btn login-btn" type="submit">Recupera</button>
                    </div>
                </form>

            </article>
        </section>
    </div>
</div>
