<div class="page">
    <div class="content-wrap">
        <header class="hero">
            <span class="hero-eyebrow">Account</span>
            <h1 class="hero-title">Password dimenticata</h1>
        </header>
        <section class="form-shell">
            <article class="form-card">

                <div *ngIf="sent" style="text-align:center; padding: 20px;">
                    <h2>Email inviata!</h2>
                    <p>Controlla la tua casella e clicca sul link per resettare la password.</p>
                </div>

                <form *ngIf="!sent" [formGroup]="form" (ngSubmit)="onSubmit()">
                    <div class="field field-full">
                        <label>Email</label>
                        <input type="email" formControlName="email" placeholder="Inserisci la tua email" />
                    </div>
                    <p class="error" *ngIf="error">{{ error }}</p>
                    <div class="form-actions field-full">
                        <button class="save-btn login-btn" type="submit">Invia link reset</button>
                    </div>
                </form>

            </article>
        </section>
    </div>
</div>
