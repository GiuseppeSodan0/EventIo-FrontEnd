<div class="admin-container">


  <div class="navbar">
    <div class="nav-left">
      <span>Home</span>
      <span>Eventi</span>
      <span>Utenti</span>
      <span>Biglietti</span>
    </div>

    <div class="nav-center">
      <h1>EVENT.IO ADMIN</h1>
    </div>

    <div class="nav-right">
      <button>UTENTE LOGGATO</button>
      <button class="logout">LOG OUT</button>
    </div>
  </div>


  <div class="search-bar">
    <input type="text" placeholder="Cerca...">
  </div>

  
  <div class="create-user">
    <button>CREA UTENTE</button>
  </div>

  <!--N.B.list ticket dinamicareale -->
<div class="grid">

  <div class="box" *ngFor="let t of tickets()">

    <h3>Ticket #{{t.id}}</h3>

    <!--N.B. badgestato stile ticketing -->
    <span class="status"
          [class.sold]="t.status === 'SOLD'"
          [class.available]="t.status === 'AVAILABLE'">
      {{t.status}}
    </span>

    <p>Prezzo: {{t.price}}€</p>
    <p>Quantità: {{t.quantity}}</p>

  </div>

</div>

<!-- N.B. filtriadmin tickets -->
<div class="filters">
  <button (click)="filterSold()">SOLD</button>
  <button (click)="filterAvailable()">AVAILABLE</button>
  <button (click)="reset()">RESET</button>
</div>


  <footer>
    Forza Napoli
  </footer>

</div>
