<div class="app-shell">
  <nav class="nav">

    <div class="nav-brand">
      <span class="brand-chip">EventIO</span>
    </div>

    <div class="nav-links">
      <a routerLink="/home" routerLinkActive="active">Home</a>
      <a routerLink="/events" routerLinkActive="active">Events</a>
      <a routerLink="/admin" routerLinkActive="active">Admin</a>
      <a routerLink="/admin-tickets" routerLinkActive="active">AdminTickets</a>
    </div>



    <div class="nav-actions">

      @if (auth.isLoggedIn()) {
        <a class="secondary-action" routerLink="/user-area">
          {{ auth.getUser()?.name }}
        </a>

        <button class="primary-action" (click)="logout()">
          Logout
        </button>
      } @else {
        <a class="primary-action" routerLink="/login">
          Login
        </a>
      }

    </div>
  </nav>

  <main class="page-content">
     <router-outlet></router-outlet>
  </main>
</div>
