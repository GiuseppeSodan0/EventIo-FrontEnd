<div class="app-shell">
    <ng-container *ngIf="!isUserArea; else userNav">
        <nav class="nav">
            <div class="nav-brand">
                <span class="brand-chip">EventIO</span>
            </div>
            <div class="nav-links">
                <div><a routerLink="/home" routerLinkActive="active">Home</a></div>
                <div><a routerLink="/events" routerLinkActive="active">Events</a></div>
                <div><a routerLink="/admin" routerLinkActive="active">Admin</a></div>
            </div>
            <div class="nav-actions">
                <a class="secondary-action" routerLink="/register" routerLinkActive="active-action">Registrati</a>
                <a class="primary-action" routerLink="/login" routerLinkActive="active-action">Login</a>
            </div>
        </nav>
    </ng-container>

    <ng-template #userNav>
        <nav class="nav">
            <div class="nav-brand">
                <span class="brand-chip">EventIO</span>
            </div>
            <div class="nav-links">
                <div><a routerLink="/user-area" routerLinkActive="active">Area Utente</a></div>
                <div><a routerLink="/home" routerLinkActive="active">Home</a></div>
            </div>
            <div class="nav-actions">
                <a class="primary-action" (click)="logout()">Logout</a>
            </div>
        </nav>
    </ng-template>

    <main>
        <router-outlet></router-outlet>
    </main>

    <footer class="footer">
        <p>EventIO &copy; 2026</p>
    </footer>
</div>
