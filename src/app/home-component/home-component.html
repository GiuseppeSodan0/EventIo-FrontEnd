<div class="home-events">

    <h2>Eventi più remunerativi</h2>

    @if (mostRenumerativeEvents.length > 0) {

        <div class="carousel">

            <button class="arrow left" (click)="prev()">‹</button>

            <div class="event-card">
                <h2>{{ mostRenumerativeEvents[currentIndex].name }}</h2>
                <p>{{ mostRenumerativeEvents[currentIndex].description }}</p>
                <p>
                    {{ mostRenumerativeEvents[currentIndex].location }}
                </p>
            </div>

            <button class="arrow right" (click)="next()">›</button>

        </div>

    }

</div>
