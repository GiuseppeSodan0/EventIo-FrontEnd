<div class="admin-tickets-container">


  <div class="header">
    <h1>GESTIONE TICKETS</h1>
  </div>

  
  <div class="filters-container">

    <div class="filters-grid">

      
      <div class="filter-card">
        <h4>Utente</h4>
        <input placeholder="Nome" [(ngModel)]="name">
        <input placeholder="Cognome" [(ngModel)]="surname">
      </div>

      
      <div class="filter-card">
        <h4>Prezzo</h4>

        <div class="price-row">
          <input type="number" placeholder="Min" [(ngModel)]="minPrice">
          <input type="number" placeholder="Max" [(ngModel)]="maxPrice">
        </div>

        
        <button class="apply-btn" (click)="applyFilters()">
          ✔ Applica Filtri
        </button>
      </div>

    
      <div class="filter-card">
        <h4>Data</h4>
        <input type="date" [(ngModel)]="date">
      </div>

    </div>

    
    <div class="filters-actions">

      <button (click)="filterSold()">💰 Venduti</button>

      <button (click)="filterAvailable()">📦 Disponibili</button>

      <button class="reset" (click)="reset()">↺ Reset</button>

    </div>

  </div>

  
  <div class="tickets-grid">

   @for (ticket of tickets(); track ticket.ticketId) {

  <div class="ticket-card">

    <h3>Ticket #{{ ticket.ticketId }}</h3>

    <p><b>Nome:</b> {{ ticket.name }} {{ ticket.surname }}</p>

    <p><b>Prezzo:</b> {{ ticket.price }}€</p>

    <p><b>Data:</b> {{ ticket.creationDate }}</p>

    <p><b>Evento:</b> {{ ticket.eventId }}</p>

    <p><b>User:</b> {{ ticket.userId }}</p>

  </div>

}

  </div>

</div>
