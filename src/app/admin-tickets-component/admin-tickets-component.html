<div class="admin-container">




    <div class="nav-center">
      <h1>EVENT.IO ADMIN</h1>
    </div>

    


  <div class="search-bar">
    <input type="text" placeholder="Cerca...">
  </div>

  
  <div class="create-user">
    <button>CREA UTENTE</button>
  </div>

  <!--N.B.list ticket dinamicareale -->
<div class="grid">

  <div class="box" *ngFor="let t of tickets()">

    <h3>Ticket #{{t.id}}</h3>

    <!--N.B. badgestato stile ticketing -->
    <span class="status"
          [class.sold]="t.status === 'SOLD'"
          [class.available]="t.status === 'AVAILABLE'">
      {{ t.status === 'SOLD' ? 'VENDUTO' : 'DISPONIBILE' }}
    </span>

    <p>Prezzo: {{t.price}}€</p>
    <p>Quantità: {{t.quantity}}</p>

  </div>

</div>


<div class="filters">
  <button (click)="filterSold()">VENDUTI</button>
  <button (click)="filterAvailable()">DISPONIBILI</button>
  <button (click)="reset()">RESET</button>

</div>
