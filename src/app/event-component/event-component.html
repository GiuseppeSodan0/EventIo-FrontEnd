<div class="page">

    <!-- FILTRI -->
<div class="filters">

    <div class="field">
        <label>Cosa</label>
        <input type="text" placeholder="Nome evento" #nameInput />
    </div>

    <div class="field">
        <label>Dove</label>
        <input type="text" placeholder="Luogo" #locationInput />
    </div>

    <div class="field">
        <label>Quando</label>
        <input type="date" #startDate />
        <input type="date" #endDate />
    </div>

    <button (click)="filtra(nameInput.value, locationInput.value, startDate.value, endDate.value)">
        Filtra
    </button>

    <button (click)="reset(nameInput, locationInput, startDate, endDate)">
        Reset
    </button>

</div>

    <!-- LISTA EVENTI -->
    <div class="events-container">

        <!-- CARD EVENTO -->
        <div class="event-card" *ngFor="let event of events()">

            <div class="event-image"></div>

            <div class="event-info">
                <h2>{{event.name}}</h2>
                <p>{{event.description}}</p>
                <span class="meta">
                    {{event.location}} - {{event.date | date:'dd/MM/yyyy'}}
                </span>
            </div>

            <div class="event-actions">
                <span class="sold-out" *ngIf="event.selledTickets >= event.maxTickets">
                    SOLD OUT
                </span>

                <button class="select-btn">Seleziona</button>

                <div class="price">
                    <br />
                    {{event.ticketPrice}}€
                </div>

            </div>

        </div>

    </div>

</div>
