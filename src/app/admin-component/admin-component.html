<div class="admin-container">

  <div class="header">
    <h1>ADMIN</h1>
  </div>

  <div class="dashboard-grid">

    <div class="dashboard-card" (click)="goTo('events')">
      <h2>EVENTI</h2>
    </div>

    <div class="dashboard-card" (click)="goTo('tickets')">
      <h2>TICKET</h2>
    </div>

    <div class="dashboard-card" (click)="goTo('users')">
      <h2>UTENTI</h2>
    </div>

  </div>

  <app-admin-event-component *ngIf="view === 'events'"></app-admin-event-component>

  <app-admin-ticket-component *ngIf="view === 'tickets'"></app-admin-ticket-component>

  <app-admin-user-component *ngIf="view === 'users'"></app-admin-user-component>

</div>
