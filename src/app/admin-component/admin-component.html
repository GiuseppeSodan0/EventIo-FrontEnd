<div class="admin-container">

  <!--header con user loggato -->
  <div class="navbar">

    <div class="nav-left">
      <span routerLink="/home">Home</span>
      <span routerLink="/events">Eventi</span>
      <span routerLink="/admin-tickets">Tickets</span>
    </div>

    <div class="nav-center">
      <h1>EVENT.IO ADMIN</h1>
    </div>

    <div class="nav-right">

      <!--utente dinamico -->
     <span *ngIf="user as u">
  {{ u.name }}
</span>

      <button class="logout" (click)="logout()">
        LOG OUT
      </button>

    </div>

  </div>

  <div class="dashboard">

    <div class="card" routerLink="/events">
      <h2>EVENTI</h2>
    </div>

    <div class="card" routerLink="/admin-tickets">
      <h2>TICKETS</h2>
    </div>

  </div>

  <div class="users-section">
    <h2>GESTIONE UTENTI</h2>
  </div>

</div>
