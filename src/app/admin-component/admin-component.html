<div class="admin-container">

  
  <div class="header">
    <h1>ADMIN</h1>
  </div>

  
  <div class="top-bar">

    <button class="user-btn">
      {{ auth.getUser()?.name || 'UTENTE' }}
    </button>

    <div class="search-bar">
      <input
        type="text"
        placeholder="Cerca..."
        [(ngModel)]="searchText"
      />

      <button (click)="onSearch()">
        CERCA
      </button>
    </div>

    <button class="logout" (click)="logout()">
      LOG OUT
    </button>

  </div>

  
  <div class="create-user">
    <button routerLink="/register">
      CREA UTENTE
    </button>
  </div>

   
 <div class="dashboard-grid">

  <div class="dashboard-card" (click)="goTo('events')">
    <h2>EVENTI</h2>
    <p>Gestione eventi sistema</p>
  </div>

  <div class="dashboard-card" (click)="goTo('tickets')">
    <h2>TICKET</h2>
    <p>Gestione vendite e biglietti</p>
  </div>

  <div *ngIf="view === 'events'">
  <h2>SEZIONE EVENTI</h2>
  <!-- qui metterai contenuto eventi -->
</div>

<div *ngIf="view === 'tickets'">
  <app-admin-tickets></app-admin-tickets>
</div>

</div>

</div>
