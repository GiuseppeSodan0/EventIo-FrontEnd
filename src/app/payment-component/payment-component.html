<div class="checkout-container">
  <div class="checkout-card" *ngIf="!isConfirmed()">
    <div class="card-rank">+</div>

    <div class="card-top">
      <span class="chip">Checkout</span>
    </div>

    <div class="checkout-grid">
      <div class="event-image">
        <img src="" alt="Evento" />
      </div>

      <div class="event-details">
        <h2>{{ eventName }}</h2>
        <p class="event-location">{{ eventLocation }}</p>
        <p class="event-description">
          Lorem ipsum dolor sit amet, consectetur adipiscing elit...
        </p>

        <div class="ticket-info">
          <span>Prezzo totale: {{ paymentObj().totalPrice }}€</span>
        </div>

        <div class="field">
          <label for="paymentMethod">Metodo di pagamento</label>
          <select
            id="paymentMethod"
            class="payment-select"
            [ngModel]="paymentObj().method"
            (ngModelChange)="paymentObj.set({...paymentObj(), method: $event})">
            <option value="PAYPAL">PAYPAL</option>
            <option value="CREDIT_CARD">CREDIT CARD</option>
            <option value="BANK_TRANSFER">BANK TRANSFER</option>
          </select>
        </div>

        <div class="card-divider"></div>

        <div class="buttons">
          <button
            class="btn-confirm"
            (click)="savePayment()"
            [disabled]="isSubmitting()">
            {{ isSubmitting() ? 'INVIO...' : 'CONFERMA' }}
          </button>

          <button class="btn-back" (click)="resetForm()">TORNA INDIETRO</button>
        </div>
      </div>
    </div>
  </div>

  <div class="checkout-card success-card" *ngIf="isConfirmed()">
    <div class="card-rank">✓</div>

    <div class="card-top">
      <span class="chip">Success</span>
    </div>

    <div class="success-content">
      <h2>Complimenti, hai effettuato l'acquisto</h2>
      <p class="success-amount">Importo: {{ paymentObj().totalPrice }}€</p>
      <button class="btn-back" (click)="resetForm()">Torna indietro</button>
    </div>
  </div>
</div>
