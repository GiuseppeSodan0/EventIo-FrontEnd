<div class="checkout-container">
  
  <div class="event-card" *ngIf="!isConfirmed()">

    <div class="event-image">
      <img src="" alt="Evento">
    </div>

    <div class="event-details">
      <h2>EVENTO</h2>
      <p class="event-location">LUOGO _ DATA</p>
      <p class="event-description">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit...
      </p>

      <div class="ticket-info">
        <span>PREZZO TOTALE: {{ paymentObj().totalPrice }}€</span>
      </div>

      <select
        class="payment-select"
        [ngModel]="paymentObj().method"
        (ngModelChange)="paymentObj.set({...paymentObj(), method: $event})">
        <option value="PAYPAL">METODO DI PAGAMENTO: PAYPAL</option>
        <option value="CREDIT_CARD">METODO DI PAGAMENTO: CREDIT CARD</option>
        <option value="BANK_TRANSFER">METODO DI PAGAMENTO: BANK TRANSFER</option>
      </select>

      <div class="buttons">
        <button 
            class="btn-confirm" 
            (click)="savePayment()" 
            [disabled]="isSubmitting()">
            {{ isSubmitting() ? 'INVIO...' : 'CONFERMA' }}
        </button>
        <button class="btn-back" (click)="resetForm()">TORNA INDIETRO</button>
      </div>
    </div>
  </div>

  <div class="event-card success-card" *ngIf="isConfirmed()">
    <div class="event-details" style="text-align: center; padding: 40px;">
      <h2>COMPLIMENTI HAI EFFETTUATO L'ACQUISTO</h2>
      <p style="font-size: 1.5rem; margin: 20px 0;">IMPORTO: {{ paymentObj().totalPrice }}€</p>
      <button class="btn-back" (click)="resetForm()">TORNA INDIETRO</button>
    </div>
  </div>

</div>
